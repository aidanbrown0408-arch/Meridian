# Meridian Capital — configuration
# Every tunable parameter lives here. Code should not hardcode values that appear
# in this file.

system:
  name: Meridian Capital
  version: "1.0"
  timezone: America/New_York
  # research | paper | live  — overridden by the CLI subcommand
  default_mode: research

universe:
  stocks:
    - SPY
    - QQQ
  crypto:
    - BTC/USDT
  # ~2 years of daily bars, per the walk-forward spec
  history_days: 730
  bar: 1d

capital:
  starting_paper_capital: 5000.0
  currency: USD

data:
  stock_source: yfinance
  crypto_source: ccxt
  crypto_exchange: binance
  # If a real source fails, Wong generates a seeded random walk instead so the
  # pipeline never hard-fails. Everything downstream is flagged synthetic.
  allow_synthetic_fallback: true
  synthetic_seed: 20240101
  synthetic:
    start_price:
      SPY: 450.0
      QQQ: 380.0
      BTC/USDT: 60000.0
    annual_drift: 0.07
    annual_vol:
      default: 0.16
      BTC/USDT: 0.55
  cache_dir: data_cache
  use_cache: true
  cache_ttl_hours: 12

costs:
  # bps, one-way. Round-trip is 2x these figures.
  stocks:
    commission_bps: 5.0
    slippage_bps: 5.0
  crypto:
    commission_bps: 5.0
    slippage_bps: 15.0

compliance:
  # "Multi-day gap in the trading-day series." Business days for stocks,
  # calendar days for crypto. Threshold is business/calendar days between
  # consecutive bars; a normal weekend or single holiday must never trip
  # this, so the default tolerates up to a 3-day gap (e.g. a holiday
  # weekend) before flagging.
  max_gap_trading_days: 3
  # "Last data point older than 3 trading days."
  stale_after_trading_days: 3
  # >50% day-over-day move suggests an unadjusted corporate action.
  max_daily_move_pct: 0.50

risk:
  profile: balanced
  max_portfolio_drawdown: 0.15
  max_strategy_drawdown: 0.25
  max_position_pct: 0.25
  max_live_traders: 3
  target_annual_vol: 0.15
  risk_free_rate: 0.0

regime:
  # ADX: standard Wilder period. High ADX + a consistently-signed MA slope +
  # normal-to-high vol => trending. Low ADX + an oscillating slope + price
  # bouncing inside its recent range => choppy. Neither clearly holding =>
  # undecided, no adjustment.
  adx_period: 14
  adx_trending_threshold: 25.0
  adx_choppy_threshold: 20.0
  ma_period: 20
  # How many of the last `slope_window` daily MA moves must share the same
  # sign to call the slope "consistent" rather than "oscillating".
  slope_window: 10
  slope_consistency_threshold: 0.70
  vol_window: 20
  vol_percentile_lookback: 252
  # Trending requires vol at or above this percentile of its own trailing
  # distribution -- "normal-to-high", i.e. not a dead-quiet tape.
  vol_normal_high_percentile: 0.30
  range_window: 20
  # Fraction of the last `range_window` bars that must NOT be a new
  # window-high/low for price to count as "bouncing within its range".
  range_bound_threshold: 0.70
  # Regime-mismatch adjustments (spec §8): halve the mismatched trader's
  # risk-parity weight, and require its signal to hold for this many
  # consecutive days before the (now smaller) position is trusted.
  capital_cut: 0.5
  confirmation_days: 2

validation:
  folds: 5
  min_folds_passing: 3
  min_sharpe: 0.5
  min_trades_per_fold: 3

strategies:
  ORBIT:
    class: OrbitStrategy
    enabled: true
    params: {fast: 20, slow: 100}
  FLUX:
    class: FluxStrategy
    enabled: true
    params: {fast: 10, slow: 50}
  REVERT:
    class: RevertStrategy
    enabled: true
    params: {period: 14, entry: 30, exit: 55}
  SURGE:
    class: SurgeStrategy
    enabled: true
    # Upgraded from the 55/20 default during design: higher conviction breakouts.
    params: {entry_window: 70, exit_window: 30}
  SPARK:
    class: SparkStrategy
    enabled: true
    params: {entry_window: 20, exit_window: 10}
  ANCHOR:
    class: AnchorStrategy
    enabled: true
    params: {window: 20, num_std: 2.0}

execution:
  # Cornelius. Paper ledger is persisted JSON so the account survives
  # between daily runs -- this is what builds the forward-tested track
  # record the spec's live-trading gate cares about.
  paper_ledger_path: reports/paper_ledger.json
  # Skip a rebalance smaller than this -- avoids churning on rounding-sized
  # deltas between today's target weight and yesterday's.
  min_trade_dollars: 25.0

lifecycle:
  # Charles/George's benching triggers (spec §10) and the operator-approval
  # gate around them.
  bench_state_path: reports/bench_state.json
  # "fails walk-forward on N consecutive daily runs."
  validation_fail_consecutive_days: 3
  # Live-drift needs a real shadow track record before it means anything.
  drift_min_track_days: 10
  drift_lookback_days: 20
  # Flag live-drift when the trailing shadow Sharpe falls below this
  # fraction of the Sharpe its backtest promised.
  drift_sharpe_ratio_threshold: 0.5

sentiment:
  # Edwin (SentimentAgent). Purely informational (spec §9 / Phase 5) -- news
  # sentiment is displayed on the dashboard and standup, but it never gates a
  # strategy, never adjusts risk-parity weights, and never blocks a trade.
  # That's Charles's and Greg's job; Edwin only reports.
  enabled: true
  provider: alpha_vantage
  api_key_env: ALPHA_VANTAGE_API_KEY
  # NEWS_SENTIMENT's own lookback window, in days.
  lookback_days: 3
  request_timeout_seconds: 10
  cache_dir: data_cache
  # Free-tier Alpha Vantage keys are rate-limited (25 requests/day); cache
  # aggressively so a daily cron run costs at most one call per symbol.
  cache_ttl_hours: 6
  # Alpha Vantage's stock tickers work as-is; crypto pairs need its own
  # CRYPTO:<SYMBOL> ticker format, unrelated to the exchange pair Wong fetches.
  crypto_ticker_map:
    BTC/USDT: CRYPTO:BTC

live:
  # Gate 2 of 3 (spec §13's three-gate refusal). Gate 1 is a real LiveBroker
  # implementation (LiveBroker.IMPLEMENTED, still False -- Phase 5 ships the
  # stub only) and gate 3 is the operator passing --i-understand-the-risk on
  # the command line. All three must pass; none is bypassable, and this flag
  # alone does nothing. Keep it false in any committed config -- flip it only
  # in a local, untracked override once a real broker adapter exists.
  enable_live_trading: false

slack:
  # Everything ships through one incoming webhook. Left unset here on
  # purpose -- set the MERIDIAN_SLACK_WEBHOOK_URL environment variable
  # rather than committing a real webhook URL to config.
  webhook_url_env: MERIDIAN_SLACK_WEBHOOK_URL
  post_daily_standup: true

visual:
  # Spec §12 — classic Wall Street: navy/gold, serif.
  primary_color: "#0F1C33"
  accent_color: "#D4AF6A"
  text_on_navy: "#E8E3D3"
  gain_color: "#7FBF7F"
  loss_color: "#C97A7A"
  serif_font: "Playfair Display"
  body_font: Georgia

logging:
  level: INFO
  file: reports/meridian.log
  console: true
